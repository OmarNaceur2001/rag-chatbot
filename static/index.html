<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechNova Support Bot</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0f172a;
      --surface:  #1e293b;
      --surface2: #334155;
      --accent:   #38bdf8;
      --accent2:  #818cf8;
      --text:     #f1f5f9;
      --muted:    #94a3b8;
      --user-bg:  #1e3a5f;
      --bot-bg:   #1e293b;
      --radius:   12px;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--surface2);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: #0f172a;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    header .badge {
      margin-left: auto;
      font-size: 0.7rem;
      padding: 4px 10px;
      background: var(--surface2);
      border-radius: 999px;
      color: var(--muted);
    }

    /* ── Chat area ────────────────────────────────────────────────────── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 720px;
      padding: 14px 18px;
      border-radius: var(--radius);
      line-height: 1.6;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

    .message.user {
      align-self: flex-end;
      background: var(--user-bg);
      border: 1px solid rgba(56,189,248,0.2);
    }
    .message.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--surface2);
    }

    .sources {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--surface2);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .sources span {
      display: inline-block;
      background: var(--surface2);
      padding: 2px 8px;
      border-radius: 6px;
      margin: 2px 4px 2px 0;
      font-size: 0.75rem;
    }
    .confirmation {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .confirmation button {
      border: 1px solid var(--surface2);
      border-radius: 8px;
      padding: 7px 12px;
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
    }
    .confirmation button:disabled { opacity: 0.5; cursor: wait; }
    .confirmation .confirm-action { border-color: var(--accent); }

    .typing {
      align-self: flex-start;
      padding: 14px 18px;
      background: var(--bot-bg);
      border: 1px solid var(--surface2);
      border-radius: var(--radius);
      display: flex; gap: 6px;
    }
    .typing .dot {
      width: 8px; height: 8px;
      background: var(--muted);
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }
    .typing .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }

    /* ── Welcome card ─────────────────────────────────────────────────── */
    .welcome {
      align-self: center;
      text-align: center;
      padding: 40px 24px;
      max-width: 520px;
    }
    .welcome h2 { font-size: 1.5rem; margin-bottom: 8px; }
    .welcome p { color: var(--muted); margin-bottom: 20px; }
    .suggestions {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    }
    .suggestions button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--surface2);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .suggestions button:hover {
      background: var(--surface2);
      border-color: var(--accent);
    }

    /* ── Input bar ────────────────────────────────────────────────────── */
    .input-bar {
      background: var(--surface);
      border-top: 1px solid var(--surface2);
      padding: 16px 24px;
      display: flex;
      gap: 12px;
    }
    #question {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--surface2);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #question:focus { border-color: var(--accent); }
    #question::placeholder { color: var(--muted); }

    #send {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #0f172a;
      border: none;
      border-radius: var(--radius);
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #send:hover { opacity: 0.9; }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="logo">T</div>
    <h1>TechNova Support Bot</h1>
    <div class="badge">RAG-powered</div>
  </header>

  <div id="chat">
    <div class="welcome">
      <h2>👋 How can I help?</h2>
      <p>I can answer questions about TechNova products, pricing, returns, warranty, and more.</p>
      <div class="suggestions">
        <button onclick="ask(this.textContent)">How much is the NovaHub Pro?</button>
        <button onclick="ask(this.textContent)">What's the return policy?</button>
        <button onclick="ask(this.textContent)">How do I contact support?</button>
        <button onclick="ask(this.textContent)">How long is the warranty?</button>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <input id="question" type="text" dir="auto" placeholder="Ask about TechNova products, pricing, support…"
           autocomplete="off" />
    <button id="send" onclick="send()">Send</button>
  </div>

<script>
const chatEl    = document.getElementById('chat');
const inputEl   = document.getElementById('question');
const sendBtn   = document.getElementById('send');
let   welcomed  = false;
let   pendingAction = false;

inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !sendBtn.disabled) send(); });

function ask(text) { inputEl.value = text; send(); }

async function send() {
  const q = inputEl.value.trim();
  if (!q) return;

  /* Remove welcome card on first message */
  if (!welcomed) {
    const wc = chatEl.querySelector('.welcome');
    if (wc) wc.remove();
    welcomed = true;
  }

  /* User bubble */
  addMessage(q, 'user');
  inputEl.value = '';
  sendBtn.disabled = true;

  /* Typing indicator */
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  chatEl.appendChild(typing);
  chatEl.scrollTop = chatEl.scrollHeight;

  try {
    const res  = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q }),
    });
    const data = await res.json();
    typing.remove();
    if (!res.ok) {
      addMessage(data.detail || 'Unable to answer right now. Please try again.', 'bot');
      return;
    }
    addMessage(data.answer, 'bot', data.sources, data.confirmation);
  } catch (err) {
    typing.remove();
    addMessage('⚠️ Something went wrong. Please try again.', 'bot');
  } finally {
    sendBtn.disabled = pendingAction;
    inputEl.disabled = pendingAction;
    if (!pendingAction) inputEl.focus();
  }
}

function addMessage(text, role, sources, confirmation) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.dir = 'auto';
  div.textContent = text;

  if (sources && sources.length) {
    const srcDiv = document.createElement('div');
    srcDiv.className = 'sources';
    srcDiv.appendChild(document.createTextNode('📚 Sources: '));
    sources.forEach(s => {
      const label = [s.filename, s.page != null ? `p.${s.page}` : null]
        .filter(Boolean)
        .join(' ');
      const span = document.createElement('span');
      if (s.url) {
        const url = new URL(s.url, window.location.href);
        if (url.protocol === 'http:' || url.protocol === 'https:') {
          const link = document.createElement('a');
          link.href = url.href;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = label;
          span.appendChild(link);
        } else {
          span.textContent = label;
        }
      } else {
        span.textContent = label;
      }
      srcDiv.appendChild(span);
    });
    div.appendChild(srcDiv);
  }

  if (confirmation) {
    pendingAction = true;
    inputEl.disabled = true;
    sendBtn.disabled = true;
    const controls = document.createElement('div');
    controls.className = 'confirmation';
    const summary = document.createElement('span');
    summary.textContent = confirmation.summary;
    controls.appendChild(summary);
    for (const [label, approved] of [['Confirm', true], ['Cancel', false]]) {
      const button = document.createElement('button');
      button.textContent = label;
      button.className = approved ? 'confirm-action' : '';
      button.addEventListener('click', () =>
        respondToConfirmation(confirmation.action_id, approved, controls)
      );
      controls.appendChild(button);
    }
    div.appendChild(controls);
  }

  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function respondToConfirmation(actionId, approved, controls) {
  const buttons = controls.querySelectorAll('button');
  buttons.forEach(button => { button.disabled = true; });
  try {
    const res = await fetch('/chat/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action_id: actionId, approved }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Unable to process the action.');
    pendingAction = false;
    inputEl.disabled = false;
    sendBtn.disabled = false;
    controls.replaceChildren(document.createTextNode(approved ? 'Confirmed.' : 'Cancelled.'));
    addMessage(data.answer, 'bot');
    inputEl.focus();
  } catch (error) {
    controls.appendChild(document.createTextNode(error.message));
    buttons.forEach(button => { button.disabled = false; });
  }
}
</script>

</body>
</html>
