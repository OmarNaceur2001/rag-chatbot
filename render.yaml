services:
  - type: web
    name: technova-rag-chatbot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: CHROMA_COLLECTION_NAME
        value: docs_gemini
      - key: TELEGRAM_MODE
        value: off
